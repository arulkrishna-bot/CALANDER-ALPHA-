        async function processSmartEventWithAI() {
            const naturalInput = document.getElementById('aiNaturalInput');
            const promptText = naturalInput.value.trim();
            if (!promptText) return;

            naturalInput.placeholder = "Gemini AI is parsing...";
            naturalInput.disabled = true;

            const systemPrompt = `You are a calendar assistant. The current calendar view is year ${state.viewYear}, month ${state.viewMonth + 1} (${englishMonths[state.viewMonth]}). Extract the calendar event details from the user's natural language input (which may be in Tamil or English). Return valid JSON.`;
            const userPrompt = `Input: "${promptText}". Extract the day of the month (1-31) and concise event title in both English and Tamil if possible.`;

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: userPrompt }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            day: { type: "INTEGER", description: "Day of the month 1-31" },
                            title: { type: "STRING", description: "Clean, concise title of the event" },
                            notes: { type: "STRING", description: "Brief advice or suggestion" }
                        },
                        required: ["day", "title"]
                    }
                }
            };

            try {
                const data = await fetchGeminiWithBackoff(apiUrl, payload);
                const rawJson = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (rawJson) {
                    const parsed = JSON.parse(rawJson);
                    if (parsed.day) {
                        document.getElementById('eventDayInput').value = parsed.day;
                    }
                    if (parsed.title) {
                        document.getElementById('eventTitleInput').value = parsed.title;
                    }
                    playSfx('success');
                }
            } catch (err) {
                console.error("AI Smart Event parsing error", err);
                // Fallback: simple day detection if any
                const match = promptText.match(/\b([1-9]|[12][0-9]|3[01])\b/);
                if (match) {
                    document.getElementById('eventDayInput').value = match[1];
                }
                document.getElementById('eventTitleInput').value = promptText;
            } finally {
                naturalInput.disabled = false;
                naturalInput.placeholder = "e.g. அப்பா பிறந்தநாள் 18 தேதி அல்லது Meeting on 22nd";
            }
        }

