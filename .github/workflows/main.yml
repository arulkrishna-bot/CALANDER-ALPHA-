                            <h4>☀️ இன்றைய சிந்தனை & நற்பலன்</h4>
                            <div style="font-size: 12.5px;">${escapeHtml(res.dailyBlessingTa)}</div>
                            ${res.dailyBlessingEn ? `<div style="font-size: 11px; opacity: 0.8; margin-top: 3px;">${escapeHtml(res.dailyBlessingEn)}</div>` : ''}
                        </div>
                    </div>
                `;
                ttsBtn.style.display = 'inline-flex';
                playSfx('success');
            } catch (err) {
                console.error("Panchangam error", err);
                body.innerHTML = `
                    <div style="padding: 16px; text-align: center; color: #ffb4b4;">
                        <p style="margin-bottom: 8px;">பஞ்சாங்கம் பெறுவதில் தாமதம் ஏற்பட்டது.</p>
                        <p style="font-size: 12px; opacity: 0.8;">Unable to retrieve Panchangam right now. Please try again.</p>
                    </div>
                `;
            }
        }

        async function openFestivalLoreAI(festivalTitle, day, lang) {
            const modal = document.getElementById('aiModal');
            const modalTitle = document.getElementById('aiModalTitle');
            const body = document.getElementById('aiModalBody');
            const ttsBtn = document.getElementById('aiTTSBtn');

            modalTitle.innerHTML = `✨ ${festivalTitle} - சிறப்பு வரலாறு`;
            modal.classList.add('active');
            playSfx('tap');

            body.innerHTML = `
                <div style="text-align: center; margin-bottom: 12px; font-size: 13px; color: var(--accent-gold);">
                    📖 பண்டிகை வரலாறு ஆராய்கிறது (Exploring with Gemini AI)...
                </div>
                <div class="ai-loading-shimmer" style="width: 80%;"></div>
                <div class="ai-loading-shimmer" style="width: 95%;"></div>
                <div class="ai-loading-shimmer" style="width: 88%;"></div>
                <div class="ai-loading-shimmer" style="width: 70%;"></div>
            `;
            ttsBtn.style.display = 'none';

            const systemPrompt = `You are a cultural historian specializing in Indian and Tamil festivals, customs, rituals, and festive cuisine. Provide engaging, authentic stories and traditional cooking recommendations. Respond in structured JSON.`;
            const userPrompt = `Provide the cultural history, spiritual meaning, traditional rituals (பூஜை வழிபாட்டு முறைகள்), and traditional festive food/prasadam recipes for "${festivalTitle}" celebrated on day ${day} of month ${state.viewMonth + 1}. Include both Tamil and English summaries.`;

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: userPrompt }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            historyStoryTa: { type: "STRING", description: "Brief historical & mythological background in Tamil" },
                            historyStoryEn: { type: "STRING", description: "Historical background in English" },
                            ritualsTa: { type: "STRING", description: "How to celebrate, rituals and worship steps in Tamil" },
                            festiveDishName: { type: "STRING", description: "Traditional sweet or festive dish name" },
                            dishPreparation: { type: "STRING", description: "How this traditional prasadam/food is prepared" },
                            festiveWish: { type: "STRING", description: "A warm festive greeting blessing" }
                        },
                        required: ["historyStoryTa", "ritualsTa", "festiveDishName", "dishPreparation"]
                    }
                }
            };

            try {
                const data = await fetchGeminiWithBackoff(apiUrl, payload);
                const rawJson = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!rawJson) throw new Error("No lore content");
                const res = JSON.parse(rawJson);

                currentInsightTextForSpeech = `${festivalTitle} பண்டிகையின் வரலாறு. ${res.historyStoryTa}. வழிபாட்டு முறைகள்: ${res.ritualsTa}. பாரம்பரிய உணவு: ${res.festiveDishName}. ${res.festiveWish || ''}`;

                body.innerHTML = `
                    <div class="ai-insight-content">
                        <div class="ai-section-box">
                            <h4>🏛️ பண்டிகையின் வரலாறு & முக்கியத்துவம்</h4>
                            <div style="font-size: 12.5px; line-height: 1.5;">${escapeHtml(res.historyStoryTa)}</div>
                            ${res.historyStoryEn ? `<div style="font-size: 11px; opacity: 0.8; margin-top: 6px; font-style: italic;">${escapeHtml(res.historyStoryEn)}</div>` : ''}
                        </div>

                        <div class="ai-section-box">
                            <h4>🪔 வழிபாட்டு முறைகள் & கொண்டாட்டம் (Rituals)</h4>
                            <div style="font-size: 12px; line-height: 1.5;">${escapeHtml(res.ritualsTa)}</div>
                        </div>

                        <div class="ai-section-box" style="border-color: rgba(255, 215, 0, 0.4); background: rgba(255, 215, 0, 0.08);">
                            <h4>🍲 பாரம்பரிய பிரசாதம்: ${escapeHtml(res.festiveDishName)}</h4>
                            <div style="font-size: 12px; line-height: 1.5;">${escapeHtml(res.dishPreparation)}</div>
                        </div>

                        ${res.festiveWish ? `
                        <div style="text-align: center; font-size: 13px; font-weight: 700; color: var(--accent-gold); margin-top: 8px;">
                            🎉 ${escapeHtml(res.festiveWish)}
                        </div>
                        ` : ''}
                    </div>
                `;
                ttsBtn.style.display = 'inline-flex';
                playSfx('success');
            } catch (err) {
                console.error("Festival lore error", err);
                body.innerHTML = `
                    <div style="padding: 16px; text-align: center; color: #ffb4b4;">
                        <p>பண்டிகை விவரங்களை பெறுவதில் பிழை ஏற்பட்டது.</p>
                        <p style="font-size: 12px; opacity: 0.8;">Could not retrieve lore at this moment. Please check connection.</p>
                    </div>
                `;
            }
        }

        async function readInsightWithTTS() {
            if (!currentInsightTextForSpeech) return;

            const ttsBtn = document.getElementById('aiTTSBtn');
            const ttsLabel = document.getElementById('ttsLabel');
            const ttsIcon = document.getElementById('ttsIcon');

            if (isTTSPlaying && activeAudioSource) {
                try {
                    activeAudioSource.stop();
                } catch (e) {}
                isTTSPlaying = false;
                ttsBtn.classList.remove('playing');
                ttsLabel.textContent = "Listen (குரல் கேட்க)";
                ttsIcon.textContent = "🎙️";
                return;
            }

            ttsLabel.textContent = "Generating Voice...";
            ttsIcon.textContent = "⏳";
            ttsBtn.classList.add('playing');

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
            const speechPrompt = `Speak in a serene, warm, expressive tone: ${currentInsightTextForSpeech.slice(0, 320)}`;

            const payload = {
                contents: [{ parts: [{ text: speechPrompt }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: {
                        voiceConfig: {
                            prebuiltVoiceConfig: { voiceName: "Aoede" }
                        }
                    }
                },
                model: "gemini-2.5-flash-preview-tts"
            };

            try {
                const response = await fetchGeminiWithBackoff(apiUrl, payload);
                const part = response?.candidates?.[0]?.content?.parts?.[0];
                const audioBase64 = part?.inlineData?.data;
                const mimeType = part?.inlineData?.mimeType || "audio/pcm;rate=24000";

                if (audioBase64) {
                    const rateMatch = mimeType.match(/rate=(\d+)/);
                    const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
                    const pcmBuffer = base64ToArrayBuffer(audioBase64);
                    const pcm16 = new Int16Array(pcmBuffer);
                    const wavBlob = pcmToWav(pcm16, sampleRate);
                    const audioUrl = URL.createObjectURL(wavBlob);

                    const audio = new Audio(audioUrl);
                    activeAudioSource = audio;
                    isTTSPlaying = true;
                    ttsLabel.textContent = "Stop Playing";
                    ttsIcon.textContent = "⏹️";

                    audio.onended = () => {
                        isTTSPlaying = false;
                        ttsBtn.classList.remove('playing');
                        ttsLabel.textContent = "Listen (குரல் கேட்க)";
                        ttsIcon.textContent = "🎙️";
                    };

                    await audio.play();
                } else {
                    throw new Error("No audio payload returned");
                }
            } catch (err) {
                console.error("TTS playback error", err);
                isTTSPlaying = false;
                ttsBtn.classList.remove('playing');
                ttsLabel.textContent = "Listen (குரல் கேட்க)";
                ttsIcon.textContent = "🎙️";
            }
        }

        function closeAIModal() {
            if (activeAudioSource && isTTSPlaying) {
                try { activeAudioSource.stop(); } catch (e) {}
                isTTSPlaying = false;
            }
            document.getElementById('aiModal').classList.remove('active');
            playSfx('tap');
        }

        function saveCustomEvent() {
            const day = parseInt(document.getElementById('eventDayInput').value, 10);
            const title = document.getElementById('eventTitleInput').value.trim();

            if (!day || day < 1 || day > 31 || !title) {
                return;
            }

            const key = `${state.viewYear}-${state.viewMonth + 1}-${day}`;
            userEvents[key] = title;

            try {
                localStorage.setItem('glass_calendar_events', JSON.stringify(userEvents));
            } catch (e) {
                console.error("Storage error", e);
            }

            state.selectedDay = day;
            playSfx('success');
            closeAddEventModal();
            renderCalendar();
        }

        const scene = document.getElementById('sceneContainer');
        const card = document.getElementById('calendarCard');

        let bounds;
        function updateBounds() {
            bounds = scene.getBoundingClientRect();
        }
        window.addEventListener('resize', updateBounds);
        updateBounds();

        document.addEventListener('mousemove', (e) => {
            if (!bounds) return;
            const mouseX = e.clientX;
            const mouseY = e.clientY;

            const cardCenterX = bounds.left + bounds.width / 2;
            const cardCenterY = bounds.top + bounds.height / 2;

            const deltaX = (mouseX - cardCenterX) / (window.innerWidth / 2);
            const deltaY = (mouseY - cardCenterY) / (window.innerHeight / 2);

            const rotateX = deltaY * -12; // tilt vertical
            const baseRotateY = deltaX * 14; // tilt horizontal
            const flipOffset = state.isFlipped ? 180 : 0;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${flipOffset + baseRotateY}deg)`;
        });

        // Reset orientation on mouse leave
        document.addEventListener('mouseleave', () => {
            const flipOffset = state.isFlipped ? 180 : 0;
            card.style.transform = `rotateX(0deg) rotateY(${flipOffset}deg)`;
        });

        // Device orientation support for mobile tilt
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                if (e.gamma !== null && e.beta !== null) {
                    const tiltX = Math.max(-15, Math.min(15, e.beta - 45)) * 0.4;
                    const tiltY = Math.max(-15, Math.min(15, e.gamma)) * 0.4;
                    const flipOffset = state.isFlipped ? 180 : 0;
                    card.style.transform = `rotateX(${-tiltX}deg) rotateY(${flipOffset + tiltY}deg)`;
                }
            });
        }

        window.onload = function() {
            renderCalendar();
            updateBounds();
        };
    </script>
</body>
</html>
