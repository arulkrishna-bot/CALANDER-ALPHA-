        function renderCalendar() {
            const year = state.viewYear;
            const month = state.viewMonth;

            // Update Header labels
            document.getElementById('taMonthTitle').textContent = tamilMonths[month];
            document.getElementById('enMonthTitle').textContent = englishMonths[month];

            document.getElementById('taYearTitle').textContent = year;
            document.getElementById('enYearTitle').textContent = year;

            // Day of week for current or selected day
            const referenceDate = new Date(year, month, Math.min(state.selectedDay, new Date(year, month + 1, 0).getDate()));
            const weekdayIndex = referenceDate.getDay();
            document.getElementById('taWeekdayTitle').textContent = tamilWeekdays[weekdayIndex];
            document.getElementById('enWeekdayTitle').textContent = englishWeekdays[weekdayIndex];

            // Render day grid for both Front and Back
            renderDaysGrid('taDaysGrid', year, month);
            renderDaysGrid('enDaysGrid', year, month);

            // Render Events list for selected/current month
            renderEventsList('taEventsList', 'ta', year, month);
            renderEventsList('enEventsList', 'en', year, month);
        }

        function renderDaysGrid(containerId, year, month) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            const firstDayIndex = new Date(year, month, 1).getDay(); // 0 is Sunday
            const totalDaysInMonth = new Date(year, month + 1, 0).getDate();
            const prevMonthDays = new Date(year, month, 0).getDate();

            const today = new Date();
            const isCurrentMonth = (today.getFullYear() === year && today.getMonth() === month);

            // Previous month trailing days
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const dayNum = prevMonthDays - i;
                const cell = document.createElement('div');
                cell.className = 'day-cell other-month';
                cell.textContent = dayNum;
                container.appendChild(cell);
            }

            // Current month days
            for (let day = 1; day <= totalDaysInMonth; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.textContent = day;

                const dayOfWeek = (firstDayIndex + day - 1) % 7;
                if (dayOfWeek === 0) {
                    cell.classList.add('text-sunday');
                }

                // Today indicator
                if (isCurrentMonth && day === today.getDate()) {
                    cell.classList.add('today');
                }

                // Selected day indicator
                if (day === state.selectedDay) {
                    cell.classList.add('selected');
                }

                // Check for events on this day
                const eventKey = `${month + 1}-${day}`;
                const hasStandardEvent = standardEvents[eventKey];
                const yearEventKey = `${year}-${month + 1}-${day}`;
                const hasUserEvent = userEvents[yearEventKey] || userEvents[eventKey];

                if (hasStandardEvent || hasUserEvent) {
                    const indicator = document.createElement('div');
                    indicator.className = 'event-indicator' + ((hasStandardEvent && hasUserEvent) ? ' multi' : '');
                    cell.appendChild(indicator);
                }

                // Click handler
                cell.addEventListener('click', () => {
                    state.selectedDay = day;
                    playSfx('tap');
                    renderCalendar();
                });

                container.appendChild(cell);
            }

            // Next month leading days to complete the 35 or 42 grid slots
            const totalCellsSoFar = firstDayIndex + totalDaysInMonth;
            const remainingCells = (totalCellsSoFar <= 35) ? (35 - totalCellsSoFar) : (42 - totalCellsSoFar);

            for (let nextDay = 1; nextDay <= remainingCells; nextDay++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell other-month';
                cell.textContent = nextDay;
                container.appendChild(cell);
            }
        }

        function renderEventsList(containerId, lang, year, month) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            const currentMonthNum = month + 1;
            const eventsFound = [];

            // 1. Gather standard events for this month
            Object.keys(standardEvents).forEach(key => {
                const [m, d] = key.split('-').map(Number);
                if (m === currentMonthNum) {
                    eventsFound.push({
                        day: d,
                        title: standardEvents[key][lang],
                        type: 'standard'
                    });
                }
            });

            // 2. Gather custom user events for this month
            Object.keys(userEvents).forEach(key => {
                const parts = key.split('-').map(Number);
                if (parts.length === 3 && parts[0] === year && parts[1] === currentMonthNum) {
                    eventsFound.push({
                        day: parts[2],
                        title: userEvents[key],
                        type: 'user'
                    });
                } else if (parts.length === 2 && parts[0] === currentMonthNum) {
                    eventsFound.push({
                        day: parts[1],
                        title: userEvents[key],
                        type: 'user'
                    });
                }
            });

            // Sort by day order
            eventsFound.sort((a, b) => a.day - b.day);

            if (eventsFound.length === 0) {
                const emptyItem = document.createElement('div');
                emptyItem.className = 'event-item-card';
                emptyItem.style.opacity = '0.7';
                emptyItem.innerHTML = `
                    <div class="event-details" style="text-align: center; font-style: italic;">
                        ${lang === 'ta' ? 'இந்த மாதத்தில் சிறப்பு நிகழ்வுகள் இல்லை' : 'No scheduled events for this month'}
                    </div>
                `;
                container.appendChild(emptyItem);
                return;
            }

            eventsFound.forEach(ev => {
                const item = document.createElement('div');
                item.className = 'event-item-card';
                if (ev.day === state.selectedDay) {
                    item.style.borderColor = 'rgba(255, 209, 102, 0.7)';
                    item.style.background = 'rgba(255, 255, 255, 0.24)';
                }

                item.innerHTML = `
                    <div class="event-badge-day">${ev.day}</div>
                    <div class="event-details">
                        <div class="event-title">${escapeHtml(ev.title)}</div>
                        <div class="event-subtext">${ev.type === 'user' ? (lang === 'ta' ? 'தனிப்பயன் குறிப்பு' : 'Custom Event') : (lang === 'ta' ? 'பண்டிகை / சிறப்பு தினம்' : 'Holiday / Festival')}</div>
                    </div>
                    <button class="ai-sparkle-btn" style="padding: 3px 6px; font-size: 10px; margin-left: auto;" onclick="event.stopPropagation(); openFestivalLoreAI('${escapeHtml(ev.title)}', ${ev.day}, '${lang}')" title="AI மூலம் அறிவோம்">
                        ✨ ${lang === 'ta' ? 'அறிவோம்' : 'Lore'}
                    </button>
                `;

                // Clicking an event highlights that day in the calendar grid
                item.addEventListener('click', () => {
                    state.selectedDay = ev.day;
                    playSfx('tap');
                    renderCalendar();
                });

                container.appendChild(item);
            });
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

